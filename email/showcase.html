<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Email showcase</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1440px;height:960px;overflow:hidden;background:#0e0e10;font-family:'Segoe UI',Arial,sans-serif;color:#f2efe8;position:relative}
.l{position:absolute;left:80px;top:96px;width:400px}
.k{font-size:14px;letter-spacing:4px;color:#8e8e93;text-transform:uppercase;display:flex;align-items:center;gap:14px}
.k:before{content:"";width:44px;height:2px;background:#c8a97e}
h1{font-family:Georgia,serif;font-weight:400;font-size:52px;line-height:1.08;margin:22px 0 18px}
h1 em{color:#c8a97e}
p{color:#a9a9ae;font-size:18px;line-height:1.6}
ul{list-style:none;margin-top:30px}
li{font-size:17px;color:#d6d3cc;margin-bottom:12px;padding-left:28px;position:relative}
li:before{content:"";position:absolute;left:0;top:11px;width:16px;height:2px;background:#c8a97e}
.desk{position:absolute;left:520px;top:60px;width:660px;height:840px;border-radius:14px;overflow:hidden;border:1px solid #2a2a2e;background:#1b1b1e}
.bar{height:34px;background:#1b1b1e;border-bottom:1px solid #2a2a2e}
.desk iframe{width:660px;height:806px;border:0;display:block}
.mob{position:absolute;left:1120px;top:200px;width:270px;height:560px;border-radius:34px;border:8px solid #000;overflow:hidden;background:#000;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.mob iframe{width:375px;height:760px;border:0;transform:scale(.678);transform-origin:0 0}
</style></head><body>
<div class="l">
 <div class="k">Email-дизайн</div>
 <h1 id="t"></h1>
 <p id="d"></p>
 <ul><li>Табличная вёрстка, инлайн-стили</li><li>Адаптив под телефон</li><li>Gmail, Яндекс, Mail.ru, Outlook</li></ul>
</div>
<div class="desk"><div class="bar"></div><iframe id="f1"></iframe></div>
<div class="mob"><iframe id="f2"></iframe></div>
<script>
const q=new URLSearchParams(location.search), f=q.get('f')||'coffee';
const meta={coffee:['Промо-письмо <em>для кофейни</em>','Акция, новинки меню и кнопка маршрута.'],autoservice:['Напоминание <em>о ТО</em>','Персональное письмо с ценами и записью.'],dental:['Подтверждение <em>записи</em>','Транзакционное письмо клиники.'],shop:['Распродажа <em>для магазина</em>','Акционное письмо с товарами и промокодом.'],renovation:['Приветственное <em>письмо</em>','Welcome-письмо после заявки на сайте.']}[f];
document.getElementById('t').innerHTML=meta[0];document.getElementById('d').textContent=meta[1];
document.getElementById('f1').src=f+'.html';document.getElementById('f2').src=f+'.html';
</script></body></html>
