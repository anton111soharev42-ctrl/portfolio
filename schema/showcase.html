<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Schema showcase</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1440px;height:960px;overflow:hidden;background:#0e0e10;font-family:'Segoe UI',Arial,sans-serif;color:#f2efe8;position:relative}
.l{position:absolute;left:80px;top:90px;width:560px}
.k{font-size:14px;letter-spacing:4px;color:#8e8e93;text-transform:uppercase;display:flex;align-items:center;gap:14px}
.k:before{content:"";width:44px;height:2px;background:#c8a97e}
h1{font-family:Georgia,serif;font-weight:400;font-size:50px;line-height:1.1;margin:22px 0 16px}
h1 em{color:#c8a97e}
.d{color:#a9a9ae;font-size:18px;line-height:1.6}
.serp{position:absolute;left:80px;top:420px;width:600px;background:#fff;border-radius:16px;padding:26px 28px;color:#202124;font-family:Arial,sans-serif;box-shadow:0 30px 60px rgba(0,0,0,.45)}
.serp .q{display:flex;align-items:center;gap:10px;border:1px solid #dfe1e5;border-radius:24px;padding:9px 16px;color:#5f6368;font-size:14px;margin-bottom:20px}
.serp .u{font-size:13px;color:#4d5156}
.serp .t{font-size:20px;color:#1a0dab;margin:4px 0 6px;line-height:1.3}
.serp .r{font-size:13px;color:#70757a;margin-bottom:6px}
.serp .r b{color:#e7711b;letter-spacing:1px}
.serp .s{font-size:14px;color:#4d5156;line-height:1.55}
.serp .x{font-size:13px;color:#4d5156;margin-top:8px}
.serp .x span{margin-right:14px}
.faq div,.pr div{display:flex;justify-content:space-between;border-top:1px solid #ebebeb;padding:10px 0;font-size:14px;color:#202124}
.faq{margin-top:10px}.pr{margin-top:10px}
.tag{position:absolute;left:500px;top:404px;z-index:2;background:#c8a97e;color:#1b1610;font-size:13px;font-weight:700;padding:6px 12px;border-radius:20px}
.code{position:absolute;left:740px;top:70px;width:620px;height:820px;background:#151518;border:1px solid #2a2a2e;border-radius:14px;overflow:hidden}
.code .h{height:40px;border-bottom:1px solid #2a2a2e;display:flex;align-items:center;padding:0 18px;color:#8e8e93;font-size:13px;font-family:Consolas,monospace}
pre{padding:18px 22px;font:14px/1.55 Consolas,monospace;color:#d6d3cc;white-space:pre-wrap;word-break:break-word}
.kk{color:#c8a97e}.ss{color:#9fd4a3}.nn{color:#8ab4f8}
</style></head><body>
<div class="l"><div class="k">Микроразметка Schema.org</div><h1 id="t"></h1><p class="d" id="d"></p></div>
<div class="serp" id="serp"></div>
<div class="tag">Расширенный сниппет</div>
<div class="code"><div class="h">&lt;script type="application/ld+json"&gt;</div><pre id="c"></pre></div>
<script src="data.js"></script>
<script>
const f=new URLSearchParams(location.search).get('f')||'coffee', s=SCHEMAS[f];
document.getElementById('t').innerHTML=s.title; document.getElementById('d').textContent=s.desc;
let h='<div class="q">🔍&nbsp; '+s.name.split('—')[0].trim()+'</div><div class="u">'+(s.crumbs||s.url)+'</div><div class="t">'+s.name+'</div>';
if(s.rating) h+='<div class="r"><b>★★★★★</b> Рейтинг: '+s.rating+' · '+s.reviews+'</div>';
h+='<div class="s">'+s.snippet+'</div>';
if(s.extra) h+='<div class="x">'+s.extra.map(e=>'<span>'+e+'</span>').join('')+'</div>';
if(s.faq) h+='<div class="faq">'+s.faq.map(q=>'<div><span>'+q+'</span><span>⌄</span></div>').join('')+'</div>';
if(s.prices) h+='<div class="pr">'+s.prices.map(p=>'<div><span>'+p[0]+'</span><b>'+p[1]+'</b></div>').join('')+'</div>';
document.getElementById('serp').innerHTML=h;
const esc=x=>x.replace(/&/g,'&amp;').replace(/</g,'&lt;');
document.getElementById('c').innerHTML=esc(JSON.stringify(s.json,null,2)).replace(/"([^"]+)":/g,'<span class="kk">"$1"</span>:').replace(/: "([^"]*)"/g,': <span class="ss">"$1"</span>');
</script></body></html>
